services:
  - type: web
    name: dproject-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Password for the /dashboard.html device list. Set the value in the Render
      # dashboard (Environment tab) — sync:false keeps it out of the repo.
      - key: DASHBOARD_KEY
        sync: false
